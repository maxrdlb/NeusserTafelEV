# Baut die GitHub-Pages-Seite aus zwei Branches:
#   main -> Live-Seite      https://maxrdlb.github.io/NeusserTafelEV/
#   dev  -> Testseite       https://maxrdlb.github.io/NeusserTafelEV/vorschau/
name: Seite veröffentlichen

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Live-Stand (main) holen
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Test-Stand (dev) holen
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Testseite unter /vorschau/ einbauen
        run: |
          rm -rf site/.git site/.github site/.claude site/vorschau
          mkdir -p site/vorschau
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '.htaccess' --exclude '*.md' dev/ site/vorschau/
          for f in site/vorschau/*.html; do
            sed -i 's#</head>#<meta name="robots" content="noindex, nofollow"><style>.vorschau-badge{position:fixed;left:12px;bottom:12px;z-index:9999;background:\#15140F;color:\#F2E21E;font:700 13px/1.2 system-ui,sans-serif;padding:9px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25)}@media print{.vorschau-badge{display:none}}</style></head>#' "$f"
            sed -i 's#<body\([^>]*\)>#<body\1><div class="vorschau-badge">Testversion – noch nicht freigegeben</div>#' "$f"
          done
          rm -f site/*.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
